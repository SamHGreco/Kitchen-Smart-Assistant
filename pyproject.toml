[project]
name = "kitchen-smart-assistant"
version = "0.1.0"
requires-python = ">=3.12"
# Dependencies are tracked in requirements.txt, not here.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src"]
# Do not import interactive hardware scripts such as app/integration_test.py.
python_files = ["test_*.py"]
